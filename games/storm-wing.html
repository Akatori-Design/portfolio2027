<body>
<canvas id="c" width="256" height="384" tabindex="0" aria-label="Storm Wing, an airplane shooter. Arrow keys or drag to fly; the plane fires by itself. X, Space, the B button or a double tap drops a bomb. P pauses, M turns the sound on or off."></canvas>
<script>
"use strict";
// Storm Wing: a vertical airplane shooter over a stormy sea, in the manner of a 16-bit Japanese shooter.
// The game runs on a 160 x 240 field. It is drawn at 256 x 384, the width of a Super Famicom screen,
// scaled up by whole pixels and then smoothed down to the window, so every pixel stays the same size.
// Everything is drawn in code: the sprites are shaded from simple shapes under one light from the top left.
// Weapons are upgraded by catching gems. A weapon gem cycles red (spread), blue (laser) and green
// (homing): catch its colour again to level that weapon up, or another colour to switch. Other gems
// give a bomb, an option (a wingman), or a shield, and medals are worth more each time.
(() => {
const W = 160, H = 240, STEP = 1000 / 60;
const RW = 256, RH = 384, K = RW / W;
const SEA_V = .36, DECK_V = .55;   // world units a frame: the sea drifts by slower than the decks above it
const rnd = (a, b) => a + Math.random() * (b - a), irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (a) => a[(Math.random() * a.length) | 0], clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k, mod = (a, n) => ((a % n) + n) % n;
const RX = (v) => Math.round(v * K);   // world units to screen pixels
const canvasOf = (w, h, draw) => {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.imageSmoothingEnabled = false;
  if (draw) draw(x);
  return c;
};
const cv = document.getElementById("c"), view = cv.getContext("2d");
const buf = canvasOf(RW, RH), g = buf.getContext("2d");

// ---------- noise, colour ----------
function hash(x, y, s = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 982451653);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s, px, py) {   // smooth value noise; it repeats every px and py cells when they are given
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const wr = (a, p) => (p ? mod(a, p) : a), h = (a, b) => hash(wr(a, px), wr(b, py), s);
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(h(xi, yi), h(xi + 1, yi), u), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), u), v);
}
function fbm(x, y, oct, s, px = 0, py = 0) {
  let a = 1, t = 0, n = 0;
  for (let i = 0; i < oct; i++) { t += a * vnoise(x, y, s + i * 17, px, py); n += a; x *= 2; y *= 2; px *= 2; py *= 2; a *= .5; }
  return t / n;
}
let seedR = 7;
const srnd = () => (seedR = (Math.imul(seedR, 1664525) + 1013904223) >>> 0) / 4294967296;   // the same every load, for the scenery
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + .5) / 16);
const RGB = (hex) => { const n = parseInt(hex.slice(1), 16); return [n >>> 16, (n >>> 8) & 255, n & 255]; };
const PK = (hex, a = 255) => { const n = parseInt(hex.slice(1), 16); return ((a << 24) | ((n & 255) << 16) | (n & 0xff00) | (n >>> 16)) >>> 0; };

// ---------- colour ramps, dark to light ----------
const OUT = "#0c0a16";
const RAMP = {
  white: ["#252a40", "#424b6b", "#677394", "#8f9cbb", "#b7c3da", "#d9e1ef", "#f0f4fb", "#ffffff"],
  blue: ["#0a1236", "#122260", "#1b388e", "#2754bc", "#3a76dc", "#5c9cf2", "#94c6ff", "#d6ecff"],
  red: ["#2a060e", "#560b14", "#8a1418", "#bc221c", "#e2442a", "#f6763c", "#ffae6c", "#ffe0b6"],
  glass: ["#04102a", "#0a234e", "#0f3d78", "#1764a6", "#2894cc", "#5ec4e8", "#b0eaf8", "#ffffff"],
  steel: ["#13151d", "#232733", "#363c4c", "#4f5769", "#6d778c", "#929db3", "#bdc6d8", "#e8edf6"],
  dgrey: ["#0e1016", "#191c24", "#262a35", "#363c49", "#4b5262", "#646d7e", "#8892a3", "#b9c1cd"],
  olive: ["#0d1209", "#1b2511", "#2b3a19", "#3f5422", "#566f2d", "#728c3c", "#9cb460", "#d4e2a0"],
  navy: ["#070a1a", "#0f1538", "#18225c", "#233286", "#3049ae", "#4668d0", "#7598ec", "#bcd2ff"],
  gold: ["#2a1604", "#5a3208", "#8e5610", "#c48618", "#e8b22a", "#f8d65a", "#fff09c", "#ffffff"],
  pink: ["#2c0418", "#5e0a32", "#9c1456", "#d42a7c", "#f2549e", "#ff8cc0", "#ffc8e0", "#ffffff"],
  orange: ["#2a0a02", "#5c1a04", "#9a3208", "#d4520e", "#f47a1a", "#ffa63a", "#ffd486", "#ffffff"],
  green: ["#06180a", "#0c3214", "#14501e", "#1e722a", "#30983a", "#54bc4e", "#94e07a", "#dcffc8"],
  purple: ["#14061e", "#2a0c40", "#46166a", "#662496", "#8a38c0", "#ae5ce2", "#d29af6", "#f6e2ff"],
  cyan: ["#03141e", "#06283c", "#0a4460", "#106888", "#1a92b0", "#3cbed4", "#8ae6f0", "#e6ffff"],
  fire: ["#3a0c06", "#7a1a08", "#c0360c", "#ec5e14", "#ff8e26", "#ffc048", "#ffec96", "#ffffff"],
  smoke: ["#101218", "#1c1f27", "#2a2e38", "#3a3f4b", "#4d5361", "#636a79", "#7d8494"],
  cloud: ["#2c3446", "#424c62", "#5c677e", "#7a859b", "#9ba5b8", "#bcc4d3", "#dce2ec", "#f4f7fb"],
};

// ---------- shapes, and a shader that lights them ----------
const LV = (() => { const l = [-.6, -.65, .45], m = Math.hypot(...l); return l.map((v) => v / m); })();
const lit = (n) => { const m = Math.hypot(n[0], n[1], n[2]) || 1; return ((n[0] * LV[0] + n[1] * LV[1] + n[2] * LV[2]) / m + 1) / 2; };
const flat = () => [0, 0, 1];
const cylV = (cx, r) => (x) => { const u = clamp((x - cx) / r, -.96, .96); return [u, 0, Math.sqrt(1 - u * u)]; };
const dome = (cx, cy, rx, ry = rx) => (x, y) => { const u = (x - cx) / rx, v = (y - cy) / ry; return [u, v, Math.sqrt(Math.max(.04, 1 - u * u - v * v))]; };
const bowl = (cx, cy, rx, ry = rx) => (x, y) => { const [u, v, w] = dome(cx, cy, rx, ry)(x, y); return [-u, -v, w]; };
function inPoly(px, py, pts) {
  let c = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) c = !c;
  }
  return c;
}
const poly = (pts) => (x, y) => inPoly(x, y, pts);
const flipX = (pts, cx) => pts.map(([x, y]) => [2 * cx - x, y]);
const sym = (pts, cx) => pts.concat(flipX(pts, cx).reverse());   // a left half outline, mirrored into a whole one
const ell = (cx, cy, rx, ry = rx) => (x, y) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
const box = (x0, y0, x1, y1) => (x, y) => x >= x0 && x < x1 && y >= y0 && y < y1;
const both = (a, b) => (x, y) => a(x, y) && b(x, y);
const either = (...f) => (x, y) => f.some((q) => q(x, y));
function segD(x, y, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, k = clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy), 0, 1);
  return Math.hypot(x - ax - dx * k, y - ay - dy * k);
}
// shade(w, h, parts): each part has a shape m, a ramp r, and a surface normal n (or a brightness v).
// Parts are painted in order; edges catch the light on the top left and fall away on the bottom right,
// a part laid over another casts a little shadow on it, and the whole is outlined in near-black.
// A roll turns the shape about its long axis, for a plane banking into a turn.
function shade(w, h, list, o = {}) {
  const roll = o.roll || 0, cx = o.cx ?? w / 2, cr = Math.cos(roll), sr = Math.sin(roll);
  const who = new Int16Array(w * h).fill(-1), val = new Float32Array(w * h);
  const mx = (x) => cx + (x + .5 - cx) / cr;
  const ins = (p, x, y) => x >= 0 && y >= 0 && x < w && y < h && p.m(mx(x), y + .5);
  list.forEach((p, k) => {
    const bev = p.bev ?? .12;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!ins(p, x, y)) continue;
      const X = mx(x), Y = y + .5;
      let v;
      if (p.v) v = p.v(X, Y);
      else { const n = (p.n || flat)(X, Y); v = (lit([n[0] * cr + n[2] * sr, n[1], n[2] * cr - n[0] * sr]) - .5) * (p.c ?? 1) + .5; }
      v += p.b ?? 0;
      if (bev) { if (!ins(p, x - 1, y) || !ins(p, x, y - 1)) v += bev; else if (!ins(p, x + 1, y) || !ins(p, x, y + 1)) v -= bev; }
      who[y * w + x] = k; val[y * w + x] = v;
    }
  });
  const id = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? -1 : who[y * w + x]);
  return canvasOf(w, h, (x2) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const k = who[y * w + x];
      if (k < 0) {
        if (o.outline !== false && (id(x - 1, y) >= 0 || id(x + 1, y) >= 0 || id(x, y - 1) >= 0 || id(x, y + 1) >= 0)) { x2.fillStyle = o.outline || OUT; x2.fillRect(x, y, 1, 1); }
        continue;
      }
      const p = list[k], r = p.r;
      let v = val[y * w + x];
      if (!o.noCast && (id(x - 1, y) > k || id(x, y - 1) > k)) v -= .14;
      if (p.d) v += (BAYER[(y & 3) * 4 + (x & 3)] - .5) / (r.length - 1) * 1.6;
      x2.fillStyle = r[clamp(Math.round(v * (r.length - 1)), 0, r.length - 1)];
      x2.fillRect(x, y, 1, 1);
    }
    if (o.post) o.post((x, y, col) => { x2.fillStyle = col; x2.fillRect(Math.floor(cx + (x - cx) * cr), Math.floor(y), 1, 1); });
  });
}
function rotated(src, a) {   // a nearest-pixel turn, so the edges stay crisp
  const sw = src.width, sh = src.height, S = Math.ceil(Math.hypot(sw, sh)) + 1;
  const sd = src.getContext("2d").getImageData(0, 0, sw, sh).data, ca = Math.cos(a), sa = Math.sin(a);
  return canvasOf(S, S, (x) => {
    const id = x.createImageData(S, S);
    for (let y = 0; y < S; y++) for (let i = 0; i < S; i++) {
      const dx = i + .5 - S / 2, dy = y + .5 - S / 2;
      const sx = Math.floor(ca * dx + sa * dy + sw / 2), sy = Math.floor(-sa * dx + ca * dy + sh / 2);
      if (sx < 0 || sy < 0 || sx >= sw || sy >= sh) continue;
      for (let k = 0; k < 4; k++) id.data[(y * S + i) * 4 + k] = sd[(sy * sw + sx) * 4 + k];
    }
    x.putImageData(id, 0, 0);
  });
}
const tint = (s, col) => canvasOf(s.width, s.height, (x) => { x.drawImage(s, 0, 0); x.globalCompositeOperation = "source-in"; x.fillStyle = col; x.fillRect(0, 0, s.width, s.height); });
const kit = (s) => ({ s, f: tint(s, "#fff6e8"), sh: tint(s, "rgba(0,4,16,.42)") });   // the sprite, its hit flash, its shadow
const dir16 = (a) => mod(Math.round(a / (Math.PI / 8)), 16);

// ---------- the planes ----------
function jetArt(roll) {   // the player's fighter, nose up
  const cx = 13, R = RAMP, side = (x) => (x < cx ? -1 : 1);
  const body = poly(sym([[13, .4], [11.9, 3], [11.1, 6], [10.5, 10], [10.3, 20], [10.7, 26], [11.3, 29.6], [13, 29.6]], cx));
  const wL = [[10.6, 11.5], [2, 20.5], [1.2, 23.6], [10.6, 22.8]], wings = either(poly(wL), poly(flipX(wL, cx)));
  const tL = [[10.8, 23.6], [5.8, 27.6], [5.4, 30.2], [10.8, 29]];
  const iL = [[10.7, 8.6], [8.6, 10.8], [8.6, 15.5], [10.6, 15.5]];
  const fL = [[11.4, 20.5], [9.6, 26.2], [9.9, 28.2], [11.6, 26]];

  return shade(26, 32, [
    { m: either(poly(tL), poly(flipX(tL, cx))), r: R.white, n: wingN, b: -.06 },
    { m: wings, r: R.white, n: wingN },
    { m: both(wings, (x, y) => segD(x, y, 10.6, 11.5, 2, 20.5) < 1.5 || segD(x, y, 15.4, 11.5, 24, 20.5) < 1.5), r: R.blue, n: wingN, bev: .06 },
    { m: both(wings, (x) => x < 5 || x > 21), r: R.blue, n: wingN },
    { m: either(poly(iL), poly(flipX(iL, cx))), r: R.steel, n: (x) => [side(x) * .55, 0, .8], b: -.06 },
    { m: body, r: R.white, n: fus },
    { m: both(body, (x, y) => y < 3.3), r: R.steel, n: fus, b: -.04 },
    { m: both(body, (x, y) => y > 12.5 && y < 22.5 && Math.abs(x - cx) < .75), r: R.red, n: fus, bev: 0 },
    { m: either(poly(fL), poly(flipX(fL, cx))), r: R.blue, n: (x) => [side(x) * .8, 0, .6] },
    { m: ell(cx, 8.4, 1.55, 3.3), r: R.glass, n: dome(cx, 8.4, 1.55, 3.3), c: 1.3, bev: 0 },
    { m: either(ell(11.7, 29.7, 1.15, 1.3), ell(14.3, 29.7, 1.15, 1.3)), r: R.steel, b: -.32, bev: 0 },
  ], { cx, roll, post: (dot) => { dot(1.9, 22.6, "#ff4a4a"); dot(24.1, 22.6, "#46ff8a"); dot(12.6, 7, "#ffffff"); } });
}
const flameArt = (L) => shade(8, 6 + L, [{
  m: either(ell(2.6, 0, 1.7, 4 + L), ell(5.4, 0, 1.7, 4 + L)), r: RAMP.fire, bev: 0,
  v: (x, y) => 1.12 - (y / (4 + L)) * .9 - Math.min(Math.abs(x - 2.6), Math.abs(x - 5.4)) * .22,
}], { outline: false });
const lifeArt = () => shade(11, 12, [
  { m: either(poly([[4.6, 4.6], [.6, 8.4], [.6, 9.8], [4.6, 9.4]]), poly([[6.4, 4.6], [10.4, 8.4], [10.4, 9.8], [6.4, 9.4]])), r: RAMP.white, b: -.04 },
  { m: poly(sym([[5.5, .3], [4.6, 3], [4.4, 10], [5.5, 11.6]], 5.5)), r: RAMP.white, n: cylV(5.5, 1.1) },
  { m: ell(5.5, 4, .8, 1.5), r: RAMP.glass, bev: 0 },
], { cx: 5.5 });
function fighterArt(body, accent) {   // nose down, like every enemy
  const cx = 10;
  const fus = poly(sym([[10, .4], [8.8, 1.6], [8.4, 5], [8.3, 13], [8.8, 16.6], [10, 19.6]], cx));
  const wL = [[8.5, 6], [1.2, 2.8], [.8, 5.8], [8.5, 12.6]], wings = either(poly(wL), poly(flipX(wL, cx)));
  const tL = [[8.6, .8], [4.6, .3], [4.4, 2.6], [8.6, 4.2]];

    { m: either(poly(tL), poly(flipX(tL, cx))), r: body, b: -.08 },
    { m: wings, r: body, n: (x) => [x < cx ? -.15 : .15, .05, 1] },
    { m: both(wings, (x) => (x > 2.4 && x < 3.9) || (x > 16.1 && x < 17.6)), r: accent, b: -.04 },
    { m: fus, r: body, n: cylV(cx, 1.9) },
    { m: ell(cx, 13.4, 1.2, 2.1), r: RAMP.glass, n: dome(cx, 13.4, 1.2, 2.1), c: 1.3, bev: 0 },

function diverArt() {   // forward-swept wings, so it reads differently at a glance
  const cx = 11, R = RAMP;

  const tL = [[9.2, 1], [6, .6], [5.8, 3.2], [9.2, 4.4]];

    { m: either(poly(tL), poly(flipX(tL, cx))), r: R.navy, b: -.06 },
    { m: wings, r: R.navy, n: (x) => [x < cx ? -.15 : .15, .05, 1] },
    { m: both(wings, (x, y) => segD(x, y, 9.1, 10.6, 1.2, 15) < 1.3 || segD(x, y, 12.9, 10.6, 20.8, 15) < 1.3), r: R.orange, bev: .04 },
    { m: fus, r: R.navy, n: cylV(cx, 2) },
    { m: ell(cx, 14.2, 1.3, 2.1), r: R.glass, n: dome(cx, 14.2, 1.3, 2.1), c: 1.3, bev: 0 },

function bomberArt() {
  const cx = 23, R = RAMP;

  const wL = [[20.2, 10], [3, 12.4], [1, 14], [1.4, 17.6], [3, 18.4], [20.2, 19.6]], wings = either(poly(wL), poly(flipX(wL, cx)));

}
const BOSS_TURRETS = [[30, 8], [12, 15], [48, 15], [30, 27]];   // where its guns sit, in the units of the old 60 x 36 bomber
const BOSS_SOCKETS = BOSS_TURRETS.map(([x, y]) => [56 + (x - 30) * K, 34 + (y - 18) * K]);
function bossArt() {   // a heavy four-engined bomber, nose down

  const fL = [[50, 3], [47.4, 11.5], [48.2, 14], [50.8, 8]];

  const lead = (x, y) => segD(x, y, 48.5, 41.5, 7, 36.6) < 1.8 || segD(x, y, 63.5, 41.5, 105, 36.6) < 1.8;
  const body = cylV(cx, 8.6);

    for (const [sx, sy] of BOSS_SOCKETS) { const hx = x + sx - 56, hy = y + sy - 34; at(HEAD_R[dir16(Math.atan2(RX(P.y) - hy, RX(P.x) - hx))], hx, hy); }

function drawGround(f) {

function drawPlayer() {
  const px = RX(P.x), py = RX(P.y), bi = clamp(Math.round((P.bank + 1) * 2), 0, 4);
  g.drawImage(FLAME[(frame >> 1) % 3], px - 4, py + 13);
  at(SPR.jet[bi].s, px, py);
  if (P.type === "L") { g.globalAlpha = .7; at(GLOW.b, px, py - 17); g.globalAlpha = 1; }
  for (const o of P.opts) { g.globalAlpha = .55 + .25 * Math.sin(frame * .2); at(GLOW.p, RX(o.x), RX(o.y)); g.globalAlpha = 1; at(SPR.option, RX(o.x), RX(o.y)); }

function render() {
  g.fillStyle = "#060f1f"; g.fillRect(0, 0, RW, RH);
  g.save();
  if (shake) g.translate(Math.round(rnd(-shake, shake)), Math.round(rnd(-shake, shake)));
  drawSea();
  for (const p of parts) if (p.k === "foam") { g.fillStyle = `rgba(226,236,246,${((p.life / p.max) * .75).toFixed(2)})`; g.fillRect(RX(p.x), RX(p.y), 2, 1); }
  for (const w of wrecks) if (w.k === "sink") { g.globalAlpha = (w.life / 80) * .9; at(SPR.boat.sh, RX(w.x), RX(w.y)); g.globalAlpha = 1; }
  for (const f of foes) if (f.k === "boat") drawGround(f);
  g.drawImage(deck, 0, -deckTop);
  if (deckTop < 0) g.drawImage(deck, 0, -deckTop - DH);
  drawLights();
  for (const w of wrecks) if (w.k === "crater") at(CRATER, RX(w.x), RX(w.y));
  for (const f of foes) if (f.k === "turret") drawGround(f);
  for (const c of clouds) at(CLOUD[c.k].sh, RX(c.x) + 22, RX(c.y) + 30);
  const showPlayer = state === "play" && P.dead === 0, blink = P.inv > 0 && frame & 4;
  for (const f of foes) if (f.air) at(f.spr.sh, RX(f.x) + 12, RX(f.y) + 18);
  if (showPlayer) at(SPR.jet[2].sh, RX(P.x) + 12, RX(P.y) + 18);
  for (const c of clouds) { g.globalAlpha = .74; at(CLOUD[c.k].s, RX(c.x), RX(c.y)); g.globalAlpha = 1; }   // low cloud, below the planes so it never hides them
  for (const it of items) if (!(it.y > H - 30 && frame & 4)) drawItem(it, RX(it.x), RX(it.y));
  for (const f of foes) if (f.air) drawFoe(f);
  if (showPlayer && !blink) drawPlayer();
  for (const s of shots) {
    const x = RX(s.x), y = RX(s.y);
    if (s.k === "l") {   // a beam: a soft blue glow, a bright edge and a white core
      const bw = Math.round(s.w * K) + ((frame >> 1) & 1), h = Math.round(s.h * K), x0 = x - (bw >> 1), y0 = y - (h >> 1);
      const col = (c, inset, grow) => { g.fillStyle = c; for (let j = 0; j < 3; j++) { const e = 3 - j; g.fillRect(x0 - grow + e, y0 + j, bw + grow * 2 - e * 2, 1); g.fillRect(x0 - grow + e, y0 + h - 1 - j, bw + grow * 2 - e * 2, 1); } g.fillRect(x0 - grow, y0 + 3, bw + grow * 2, h - 6); };
      col("rgba(60,140,255,.32)", 0, 3); col("#3a86f0", 0, 1); col("#9ad8ff", 0, 0);   // rounded at both ends

    } else if (s.k === "h") at(MISSILE[mod(Math.round((Math.atan2(s.vy, s.vx) + Math.PI / 2) / (Math.PI / 8)), 16)], x, y);
    else if (s.k === "o") at(needleArt, x, y);

  }

    else if (p.k === "ring") {
      const r = p.r * K * (1 - p.life / p.max) + 3;

      for (let i = 0; i < 28; i++) { const a = (i / 28) * 6.283; g.fillRect(Math.round(RX(p.x) + Math.cos(a) * r), Math.round(RX(p.y) + Math.sin(a) * r), 1, 1); }

  for (const a of anims) if (a.t >= 0) at(a.fr[Math.floor(a.t / a.rate)], RX(a.x), RX(a.y));
  for (const p of parts) {

    else if (p.k === "debris") { g.fillStyle = p.c; g.fillRect(RX(p.x), RX(p.y), 2, 2); if (p.life & 4) { g.fillStyle = "#ffa63a"; g.fillRect(RX(p.x), RX(p.y), 1, 1); } }
  }
  for (const b of bullets) at(BUL[b.c][(frame >> 2) & 1], RX(b.x), RX(b.y));
  for (const p of pops) txt(p.s, RX(p.x), RX(p.y) - 4, p.st, { align: "center" });
  g.fillStyle = "rgba(190,210,235,.32)";
  for (const d of rain) { const x = Math.round(d.x), y = Math.round(d.y); g.fillRect(x, y, 1, 3); g.fillRect(x - 1, y + 3, 1, 3); }
  if (bombFx > 0) {
    g.fillStyle = `rgba(255,248,220,${((bombFx / 36) * .55).toFixed(2)})`; g.fillRect(0, 0, RW, RH);
    const r = (36 - bombFx) * 9;
    g.fillStyle = "rgba(255,255,255,.85)";
    for (let i = 0; i < 64; i++) { const a = (i / 64) * 6.283; g.fillRect(Math.round(RX(P.x) + Math.cos(a) * r), Math.round(RX(P.y) + Math.sin(a) * r), 2, 2); }
  }

// ---------- the screen furniture ----------
const pad8 = (n) => String(n).padStart(8, "0");
function frameRect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x + 1, y, w - 2, 1); g.fillRect(x + 1, y + h - 1, w - 2, 1); g.fillRect(x, y + 1, 1, h - 2); g.fillRect(x + w - 1, y + 1, 1, h - 2); }
const PANEL = ["#2a3d9c", "#25378f", "#203182", "#1b2a74", "#172467", "#131e5a", "#0f184d", "#0b1240"];
function panel(x, y, w, h, a = .9) {   // a 16-bit menu window: banded blue glass in a bevelled frame
  g.globalAlpha = a;
  for (let j = 0; j < h - 2; j++) { g.fillStyle = PANEL[Math.floor((j / (h - 2)) * 8)]; g.fillRect(x + 1, y + 1 + j, w - 2, 1); }
  g.globalAlpha = 1;
  frameRect(x - 1, y - 1, w + 2, h + 2, OUT); frameRect(x, y, w, h, "#e6ecff"); frameRect(x + 1, y + 1, w - 2, h - 2, "#7d8fd6");
}
function glassBox(x, y, w, h) { g.fillStyle = "rgba(4,6,18,.6)"; g.fillRect(x + 1, y, w - 2, h); g.fillRect(x, y + 1, w, h - 2); frameRect(x, y, w, h, "rgba(190,205,240,.42)"); }
function shine(c, s, x, y, p) {   // a glint sweeping across the logo
  const sx = s.getContext("2d");
  sx.globalCompositeOperation = "source-over"; sx.clearRect(0, 0, s.width, s.height); sx.drawImage(c, 0, 0);
  sx.globalCompositeOperation = "source-atop"; sx.fillStyle = "rgba(255,255,255,.8)";
  sx.beginPath(); sx.moveTo(p, 0); sx.lineTo(p + 9, 0); sx.lineTo(p + 9 - s.height * .5, s.height); sx.lineTo(p - s.height * .5, s.height); sx.fill();
  g.drawImage(s, x, y);
}
function drawBanner(bn) {
  const k = bn.t, L = bn.life, inn = Math.min(1, k / 18), out = Math.max(0, (k - (L - 16)) / 16);
  const slide = Math.round((1 - inn) ** 3 * RW - out * out * RW), y = 150;
  for (let j = 0; j < 44; j++) { g.fillStyle = `rgba(4,6,18,${(.6 * (1 - Math.abs(j - 22) / 24) * (inn - out)).toFixed(3)})`; g.fillRect(0, y + j, RW, 1); }

  txt(bn.a, RW / 2 + slide, y + 6, bn.st, { bold: true, s: 2, align: "center" });

}
function hud() {

  txt("HI-SCORE", 142, 4, "silver", { align: "right" }); txt(pad8(Math.max(hi, score)), 146, 4, "silver", { bold: true });
  txt("SCORE", 142, 15, "gold", { align: "right" }); txt(pad8(score), 146, 15, "gold", { bold: true });

    at(BTN_P, PB[0], PB[1]);
    g.fillStyle = OUT; g.fillRect(12, 11, 4, 12); g.fillRect(18, 11, 4, 12);
    g.fillStyle = "#e8edf6"; g.fillRect(13, 12, 2, 10); g.fillRect(19, 12, 2, 10);

      g.fillStyle = on ? ramp[4] : "#1c1f27"; g.fillRect(x, 366, 10, 2);
      g.fillStyle = on ? ramp[2] : "#14161d"; g.fillRect(x, 368, 10, 2);
    }

    g.globalAlpha = 1;
    at(BADGE, BB[0] + 14, BB[1] - 15); txt(bombs, BB[0] + 14, BB[1] - 19, "white", { align: "center" });
    if (boss && !boss.dying && boss.y > 0) {

      const bw = Math.ceil((212 * Math.max(0, boss.hp)) / boss.max);

      g.fillStyle = "#2a0c12"; g.fillRect(35, 31, 214, 7);

}
function title() {
  g.fillStyle = "rgba(4,6,16,.42)"; g.fillRect(0, 0, RW, RH);
  const ay = 42, by = ay + LOGO_A.height - 10, ky = by + LOGO_B.height + 4;
  const ax = (RW - LOGO_A.width) >> 1, bx = (RW - LOGO_B.width) >> 1, kx = (RW - KANA.width) >> 1;
  const sw = frame % 220;
  if (sw < 50) { shine(LOGO_A, SHINE[0], ax, ay, sw * 6 - 20); shine(LOGO_B, SHINE[1], bx, by, sw * 6 - 50); }
  else { g.drawImage(LOGO_A, ax, ay); g.drawImage(LOGO_B, bx, by); }
  g.fillStyle = "#b01c1c"; g.fillRect(kx - 30, ky + (KANA.height >> 1), 24, 1); g.fillRect(kx + KANA.width + 6, ky + (KANA.height >> 1), 24, 1);
  g.drawImage(KANA, kx, ky);
  if ((frame >> 5) & 1) txt("PUSH START BUTTON", RW / 2, ky + 30, "gold", { bold: true, align: "center" });
  const py = ky + 54;
  panel(14, py, 228, 128);
  txt("POWER UP", RW / 2, py + 8, "silver", { align: "center" });
  ["V", "L", "H"].forEach((k, i) => { const cx = 58 + i * 70; drawItem({ type: "W", cyc: i, t: frame + i * 16 }, cx, py + 34); txt(WEAPON[k].name, cx, py + 46, WEAPON[k].st, { align: "center" }); });
  txt("SAME COLOUR: LEVEL UP", RW / 2, py + 60, "grey", { align: "center" });
  ["B", "O", "S"].forEach((k, i) => { const cx = 58 + i * 70; drawItem({ type: k, t: frame + i * 16 + 8 }, cx, py + 86); txt(ITEM[k].name, cx, py + 98, ITEM[k].st, { align: "center" }); });
  txt("MEDALS ADD UP", RW / 2, py + 112, "grey", { align: "center" });
  const cy = py + 140;
  txt("ARROWS OR DRAG: FLY", RW / 2, cy, "silver", { align: "center" });
  txt("X, SPACE OR B: BOMB   P: PAUSE", RW / 2, cy + 11, "silver", { align: "center" });
  SOUND_Y = cy + 26;
  txt("SOUND " + (muted ? "OFF" : "ON") + "  (M)", RW / 2, SOUND_Y, muted ? "grey" : "cyan", { align: "center" });
}
let SOUND_Y = 360;

// ---------- the screen: scale up by whole pixels, and let the browser smooth it down to the window ----------
const mos = canvasOf(RW, RH);
function fit() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const k = clamp(Math.ceil(Math.min(r.width / RW, r.height / RH) * dpr - .02), 1, 6);
  if (cv.width !== RW * k) { cv.width = RW * k; cv.height = RH * k; }
}
function blit() {
  view.imageSmoothingEnabled = false;
  const m = Math.ceil(mosaic);
  if (m > 1) {   // the mosaic the console used for scene changes
    const w = Math.ceil(RW / m), h = Math.ceil(RH / m), mx = mos.getContext("2d");
    mx.imageSmoothingEnabled = false; mx.clearRect(0, 0, w, h); mx.drawImage(buf, 0, 0, w, h);
    view.drawImage(mos, 0, 0, w, h, 0, 0, cv.width, cv.height);
  } else view.drawImage(buf, 0, 0, cv.width, cv.height);
}
addEventListener("resize", fit);
fit();
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  let stepped = false;
  while (acc >= STEP) { acc -= STEP; if (!paused) update(); stepped = true; }
  if (stepped) render();   // at most 60 frames a second, whatever the screen
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- input: keys, or drag anywhere to fly; tap the round buttons to pause or bomb ----------
const keys = {};
const begin = () => { if (state === "title" || (state === "over" && over > 60)) { start(); return true; } return false; };
const toggleMute = () => { muted = !muted; try { localStorage.setItem("storm-wing-mute", muted ? "1" : "0"); } catch (err) {} };
addEventListener("keydown", (e) => {
  audio();
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === "KeyM") { toggleMute(); return; }
  if (state !== "play") { if (e.code === "Space" || e.code === "Enter" || e.code === "KeyZ") begin(); return; }
  if (e.code === "KeyP" || e.code === "Escape") { paused = !paused; sfx.pause(); }
  else if (paused) { if (e.code === "Space" || e.code === "Enter") paused = false; }
  else if (e.code === "KeyX" || e.code === "Space" || e.code === "KeyB") bomb();
});
addEventListener("keyup", (e) => { keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; if (state === "play") paused = true; });   // looking away pauses it
let drag = null, lastTap = 0;
function screenPoint(e) {
  const r = cv.getBoundingClientRect(), s = Math.min(r.width / RW, r.height / RH);
  return [(e.clientX - r.left - (r.width - RW * s) / 2) / s, (e.clientY - r.top - (r.height - RH * s) / 2) / s];
}
cv.addEventListener("pointerdown", (e) => {
  audio(); cv.focus();
  const [sx, sy] = screenPoint(e);
  if (state === "title" && Math.abs(sy - SOUND_Y - 4) < 8 && Math.abs(sx - RW / 2) < 64) { toggleMute(); return; }
  if (begin()) return;
  if (state === "play") {
    if (Math.hypot(sx - PB[0], sy - PB[1]) < 17) { paused = !paused; sfx.pause(); return; }
    if (paused) { paused = false; return; }
    if (Math.hypot(sx - BB[0], sy - BB[1]) < 24) { bomb(); return; }
  }
  const now = performance.now();
  if (now - lastTap < 300) bomb();
  lastTap = now;

  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const r = cv.getBoundingClientRect(), s = Math.min(r.width / W, r.height / H);
  if (state === "play" && P.dead === 0 && !paused) {
    P.x = clamp(P.x + ((e.clientX - drag.x) / s) * 1.2, 7, W - 7);
    P.y = clamp(P.y + ((e.clientY - drag.y) / s) * 1.2, 12, H - 16);
  }
  drag = { x: e.clientX, y: e.clientY };
});
const release = () => { drag = null; };
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);
cv.focus();
})();
